<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore Thala 7, a modern fashion showcase featuring stylish collections, popular brands, and a curated shopping experience.">
    <link rel="stylesheet" href="payment.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Thala7. - Where Style Meets Confidence.</title>
</head>
<body>
    <main>
        <a href="./index.html">⮜</a>
        <div class="checkout-container">
            <div class="left">
                <h3 class="title">Checkout</h3> <br>
                <h2>Contact Details</h2>
                <div class="contact">
                    <label for="email">Email Id:</label>
                    <input type="email" name="email" id="email" placeholder="Enter Here " required>
                </div>
                <div class="payment">
                    <h2>Payment</h2>
                    <div class="payment-methods">
                        <div class="pay-method">
                            <div class="images">
                                <img src="./images/credit-card.png" alt="Card">
                            </div>
                            <p>Card</p>
                        </div>
                        <div class="pay-method">
                            <div class="images">
                                <img src="./images/bitcoin.png" alt="Crypto">
                            </div>
                            <p>Crypto</p>                        
                        </div>
                        <div class="pay-method">
                            <div class="images">
                                <img src="./images/bank (1).png" alt="bank">
                            </div>
                            <p>Bank</p>                        
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-detail">
                            <label for="card-num">Card Number:</label>
                            <input type="number" name="card-num" id="card-num" placeholder="Enter Card Number" required>
                        </div>
                        <div class="card-info">
                            <div class="card-detail">
                                <label for="expiry">Expiry:</label>
                                <input type="date" name="expiry" id="expiry" required>
                            </div>
                            <div class="card-detail">
                                <label for="cvc">CVC:</label>
                                <input type="password" name="cvc" id="cvc" placeholder="CVC" required>
                            </div>
                        </div>
                        <div class="card-info">
                            <div class="card-detail">
                                <label for="country">Country:</label>
                                <select name="country" id="country">
                                    <option value="india">India</option>
                                    <option value="usa">USA</option>
                                    <option value="indonasia">Indonasia</option>
                                    <option value="nepal">Nepal</option>
                                </select>
                            </div>
                            <div class="card-detail">
                                <label for="zip">ZIP:</label>
                                <input type="number" name="zip" id="zip" placeholder="ZIP Code">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="cart-overview">
                <h1>Order Summary</h1> <br> <br>
            <h3>Enter Coupon Code</h3>
            <div class="coupon">
                <input type="text" placeholder="Enter Coupon">
                <button class="btn">Apply Coupon</button>
            </div>
            <div class="bill">
                <div>
                    <span>Sub Total</span>
                    <span>₹14997</span>
                </div>
                <div>
                    <span>Taxes (applicable)</span>
                    <span>₹199</span>
                </div>
                <div>
                    <span>Discount</span>
                    <span>0</span>
                </div>
                <div>
                    <span class="color"><strong>Total</strong></span>
                    <span class="color"><strong>₹15196</strong></span>
                </div>
                <button class="btn pay-btn"><a href="./payment.html">Pay Now ₹15196</a></button>
            </div>
            <div class="certificates">
                <div class="certificate">
                    <img src="https://th.bing.com/th/id/OIP.QpfVjqVDSlnnshd9gSmZmwHaCY?w=310&h=112&c=7&r=0&o=7&pid=1.7&rm=3" alt="Paytm">
                </div>
                <div class="certificate">
                    <img src="https://bsmedia.business-standard.com/_media/bs/img/article/2025-02/20/thumb/fitandfill/1200X630/1740060800-2235.jpg" alt="razorpay">
                </div>
                <div class="certificate">
                    <img src="https://th.bing.com/th/id/OIP.T_IwAFVwAX9a9g-4zCvGqAAAAA?w=303&h=180&c=7&r=0&o=7&pid=1.7&rm=3" alt="phonepe">
                </div>
            </div>

            </div>
        </div>
    </main>
</body>
</html>
